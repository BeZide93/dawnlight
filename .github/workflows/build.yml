name: Build

on:
  workflow_dispatch:
  push:
    branches: ["*"]
    tags: ["*"]
  pull_request:

env:
  SYMGEN_VERSION: v1.2.4

jobs:
  build:
    name: Build ${{matrix.platform}}
    runs-on: ${{matrix.runner}}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-latest
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
          - platform: macos-arm64
            runner: macos-latest
          - platform: macos-x86_64
            runner: macos-latest
            cmake_args: -DCMAKE_OSX_ARCHITECTURES=x86_64
          - platform: ios-arm64
            runner: macos-latest
            cmake_args: >-
              -DCMAKE_SYSTEM_NAME=iOS
              -DCMAKE_OSX_ARCHITECTURES=arm64
              -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0
          - platform: windows-amd64
            runner: windows-latest
            msvc_arch: amd64
          - platform: windows-arm64
            runner: windows-latest
            msvc_arch: amd64_arm64
          - platform: android-aarch64
            runner: ubuntu-latest
            android_ndk: "29.0.14206865"

    steps:
      - uses: actions/checkout@v7

      - name: Test Z item provider guards
        if: matrix.platform == 'linux-x86_64'
        run: python3 tests/z_item_provider_guard_test.py

      - name: Test Bullet Time gyro compatibility
        if: matrix.platform == 'linux-x86_64'
        run: python3 tests/bullet_time_gyro_compat_test.py

      - name: Test Dual Wield
        if: matrix.platform == 'linux-x86_64'
        run: |
          python3 tests/dual_wield_test.py
          python3 tests/second_sword_test.py

      - name: Test Fierce Deity visuals and lifecycle
        if: matrix.platform == 'linux-x86_64'
        run: |
          python3 tests/fierce_deity_lifecycle_test.py
          python3 tests/fierce_deity_visual_test.py
          python3 tests/fierce_deity_transition_test.py
          python3 tests/fierce_deity_particles_test.py
          python3 tests/fierce_deity_activation_test.py
          python3 tests/fierce_deity_movement_test.py
          python3 tests/touch_midna_test.py
          python3 tests/jump_abilities_test.py

      - name: Test Collection Dual Wield
        if: matrix.platform == 'linux-x86_64'
        run: python3 tests/collection_dual_wield_test.py

      - name: Test Shield Attack and Flurry Rush prompts
        if: matrix.platform == 'linux-x86_64'
        run: python3 tests/shield_attack_prompt_test.py

      - name: Test Boss Rush hook lifecycle
        if: matrix.platform == 'linux-x86_64'
        run: python3 tests/bossrush_hook_lifecycle_test.py

      - name: Test configurable stamina and mode overrides
        if: matrix.platform == 'linux-x86_64'
        run: |
          python3 tests/stamina_settings_test.py
          python3 tests/mode_unlock_test.py
          python3 tests/glide_stamina_test.py
          python3 tests/wolf_sprint_test.py

      - name: Test HD HUD button glyph compatibility
        if: matrix.platform == 'linux-x86_64'
        run: |
          python3 tests/hd_hud_glyph_test.py
          python3 tests/hud_text_anchor_test.py
          python3 tests/round_button_overlays_test.py

      - name: Test HUD fades
        if: matrix.platform == 'linux-x86_64'
        run: python3 tests/hud_fade_test.py

      - name: Read pinned Dusklight version
        id: dusklight
        shell: bash
        run: echo "version=$(sed -n 's/.*set(DUSKLIGHT_VERSION "\([^"]*\)").*/\1/p' CMakeLists.txt)" >> "$GITHUB_OUTPUT"

      - name: Cache Dusklight sources
        uses: actions/cache@v6
        with:
          path: dusklight
          key: dusklight-${{runner.os}}-${{steps.dusklight.outputs.version}}

      - name: Enable Visual Studio environment
        if: matrix.msvc_arch
        uses: step-security/msvc-dev-cmd@v1
        with:
          arch: ${{matrix.msvc_arch}}

      - name: Install ninja
        if: matrix.msvc_arch
        run: choco install ninja

      - name: Install Android NDK
        if: matrix.android_ndk
        uses: android-actions/setup-android@v4
        with:
          packages: ndk;${{matrix.android_ndk}}

      - name: Configure CMake
        shell: bash
        run: |
          args=(-G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo ${{matrix.cmake_args}})
          if [[ -n "${{matrix.android_ndk}}" ]]; then
            args+=(-DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/${{matrix.android_ndk}}/build/cmake/android.toolchain.cmake"
                   -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28)
          fi
          cmake -B build "${args[@]}"

      - name: Test Touch Editor and Quick Access compatibility
        if: matrix.platform == 'linux-x86_64'
        run: |
          python3 tests/touch_button_editor_test.py
          python3 tests/touch_editor_install_test.py

      - name: Test HUD fade configuration persistence
        if: matrix.platform == 'linux-x86_64'
        run: python3 tests/hud_fade_config_test.py build

      - name: Build
        run: cmake --build build --parallel

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mod-${{matrix.platform}}
          path: build/mods/*.dusk
          if-no-files-found: error

  combine:
    name: Combine bundles
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download platform bundles
        uses: actions/download-artifact@v8
        with:
          pattern: mod-*
          path: dist

      - name: Install symgen
        run: |
          curl -fsSL -o symgen \
            "https://github.com/encounter/symgen/releases/download/${SYMGEN_VERSION}/symgen-linux-x86_64"
          chmod +x symgen

      - name: Merge bundles
        run: |
          name=$(basename dist/mod-linux-x86_64/*.dusk)
          python3 tools/merge_mod.py -o "combined/$name" --symgen ./symgen \
            dist/*/*.dusk

      - name: Upload combined bundle
        uses: actions/upload-artifact@v7
        with:
          name: mod-combined
          path: combined/*.dusk
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{github.token}}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # Preserve the existing release notes and refresh the build asset.
            gh release upload "$GITHUB_REF_NAME" combined/*.dusk --clobber
          else
            gh release create "$GITHUB_REF_NAME" combined/*.dusk --verify-tag --generate-notes
          fi
